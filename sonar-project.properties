# --- Identificación del proyecto ---
sonar.organization=aitorsiius
sonar.projectKey=Aitorsiius_clinic-classifier
sonar.projectName=clinic-classifier

# --- Código a analizar ---
sonar.sources=app/src,auth-service,audit-service,history-service,log-service,api-gateway-service,llm-query-processor-service,backend-service/cie_classifier

# --- Exclusiones ---
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.test.tsx,**/cie10_qdrant/**,**/cie10_qdrant_*/**,**/loaders/json/**,**/loaders/xlsx/**,**/tests/**,**/conftest.py

# --- Versión de Python ---
sonar.python.version=3.11

# --- Cobertura ---
# Informes generados por ./run-tests.sh (uno por microservicio): coverage-*.xml
sonar.python.coverage.reportPaths=coverage-*.xml

# Ficheros excluidos del CÁLCULO de cobertura (siguen analizándose para
# code smells/bugs/seguridad, pero NO cuentan como "sin cubrir"):
#   - app/**: el frontend (TypeScript/React) no aporta informe de cobertura, así
#     que se excluye para que no figure como 0% y no penalice la métrica.
#   - **/loaders/**: scripts de carga/indexación que se ejecutan una sola
#     vez para construir la base vectorial; no forman parte del runtime de los
#     servicios y no se les exige cobertura.
#   - tests/ y conftest.py: el propio código de prueba.
sonar.coverage.exclusions=app/**,**/loaders/**,**/conftest.py,**/tests/**