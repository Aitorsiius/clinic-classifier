[pytest]
# Los tests de cada microservicio se ejecutan POR SEPARADO (ver run-tests.sh),
# porque todos los servicios tienen un módulo 'main' y compartir un único
# proceso provocaría colisiones de importación. No se define 'testpaths' a
# propósito: usa ./run-tests.sh para ejecutarlos todos.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
