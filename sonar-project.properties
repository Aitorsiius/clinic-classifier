# --- Identificación del proyecto ---
sonar.organization=aitorsiius
sonar.projectKey=Aitorsiius_clinic-classifier
sonar.projectName=clinic-classifier

# --- Código a analizar ---
sonar.sources=app/src,auth-service,audit-service,history-service,log-service,api-gateway-service,llm-query-processor-service,backend-service/cie_classifier

# --- Exclusiones ---
# Se excluyen dependencias, builds, datos, el índice Qdrant y el propio código
# de test (los tests no se analizan como código de producción; su cobertura sí
# se importa más abajo).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.test.tsx,**/cie10_qdrant/**,**/cie10_qdrant_*/**,**/loaders/json/**,**/loaders/xlsx/**,**/tests/**,**/conftest.py

# --- Versión de Python ---
sonar.python.version=3.10.12

# --- Cobertura ---
# Informes generados por ./run-tests.sh (uno por microservicio): coverage-*.xml
sonar.python.coverage.reportPaths=coverage-*.xml